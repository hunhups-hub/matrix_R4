; PlatformIO Project Configuration File
; Board: Arduino UNO R4 WiFi (Renesas RA4M1 Cortex-M4 @ 48 MHz)

[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

monitor_speed = 115200
monitor_eol = LF

lib_deps =
    matrix-robotics/MatrixMiniR4@^1.2.6

build_flags =
    -Wall
    -Wextra

build_src_flags =
    -Wall
    -Wextra
    -Werror

test_ignore = *

[env:native]
platform = native
platform_packages =
    platformio/toolchain-gccmingw32@^1.40900.0
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Werror
    -Iinclude
build_src_filter =
    +<robot_logic.cpp>
    +<persistent_config.cpp>
    +<auto_heading.cpp>
    +<servo_logic.cpp>
    +<link_failsafe.cpp>
    +<power_stability.cpp>
    +<serial_control.cpp>
test_build_src = yes
